<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Parts for Your Vehicle | Partify</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- You should hire me ;) -->
  <main class="finder">
    <div class="finder__brandbar"></div>
    <span class="finder__tag">Part Finder</span>
    <header class="finder__head">
      <a class="brand" href="https://partifyusa.com/">
        <img class="brand__logo" src="assets/partify-logo.png" alt="Partify USA" width="478" height="150">
      </a>
      <h1>Find parts for your vehicle</h1>
      <p>Find your vehicle and we'll take you to the matching parts. Add a part type to jump straight to it.</p>
    </header>

    <div class="garage" id="garage" hidden>
      <div class="garage__info">
        <span class="garage__label">Saved vehicle</span>
        <span class="garage__vehicle" id="garage-vehicle"></span>
      </div>
      <div class="garage__actions">
        <button type="button" class="garage__btn garage__btn--use" id="garage-use">Use</button>
        <button type="button" class="garage__btn" id="garage-clear">Clear</button>
      </div>
    </div>

    <form id="fitment-form" class="finder__form" novalidate>
      <div class="field">
        <label id="make-label" for="make-input">Make</label>
        <div class="combo" data-step="make">
          <input class="combo__input" id="make-input" type="text" role="combobox"
            aria-expanded="false" aria-autocomplete="list" aria-controls="make-list"
            aria-labelledby="make-label" autocomplete="off" placeholder="Select make">
          <ul class="combo__list" id="make-list" role="listbox" aria-label="Make" hidden></ul>
        </div>
      </div>

      <div class="field">
        <label id="model-label" for="model-input">Model</label>
        <div class="combo" data-step="model">
          <input class="combo__input" id="model-input" type="text" role="combobox"
            aria-expanded="false" aria-autocomplete="list" aria-controls="model-list"
            aria-labelledby="model-label" autocomplete="off" placeholder="Select model" disabled>
          <ul class="combo__list" id="model-list" role="listbox" aria-label="Model" hidden></ul>
        </div>
      </div>

      <div class="field">
        <label id="year-label" for="year-input">Year</label>
        <div class="combo" data-step="year">
          <input class="combo__input" id="year-input" type="text" role="combobox"
            aria-expanded="false" aria-autocomplete="list" aria-controls="year-list"
            aria-labelledby="year-label" autocomplete="off" placeholder="Select year" disabled>
          <ul class="combo__list" id="year-list" role="listbox" aria-label="Year" hidden></ul>
        </div>
      </div>

      <div class="field">
        <label id="productType-label" for="productType-input">Part <span class="field__optional">(optional)</span></label>
        <div class="combo" data-step="productType">
          <input class="combo__input" id="productType-input" type="text" role="combobox"
            aria-expanded="false" aria-autocomplete="list" aria-controls="productType-list"
            aria-labelledby="productType-label" autocomplete="off" placeholder="All parts" disabled>
          <ul class="combo__list" id="productType-list" role="listbox" aria-label="Part" hidden></ul>
        </div>
      </div>

      <p id="count" class="finder__count" aria-live="polite"></p>

      <button type="submit" id="submit" class="finder__submit" disabled>Shop parts</button>
      <button type="button" id="reset" class="finder__reset" hidden>Clear form</button>
    </form>

    <p id="status" class="finder__status" role="status" aria-live="polite"></p>
  </main>

  <script src="vehicles.js"></script>
  <script src="app.js"></script>
</body>
</html>
